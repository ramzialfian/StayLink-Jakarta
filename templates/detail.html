<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8"><title>Detail - {{ nama_hotel }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #43d1a2; min-height: 100vh; }
        .back-link { color: white; text-decoration: none; font-weight: 600; margin-bottom: 25px; display: inline-block; cursor: pointer; }
        .detail-card { border: none; border-radius: 35px; background: white; padding: 45px; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .img-container { background-color: #f8f9fa; border-radius: 25px; height: 380px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px solid #eee; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .hotel-title { font-weight: 800; color: #222; font-size: 2.4rem; text-transform: uppercase; }
        .fac-badge { background: #f0fdf4; color: #43d1a2; border: 1px solid #43d1a2; padding: 6px 18px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; margin-right: 10px; margin-bottom: 12px; display: inline-block; }
        .price-val { color: #ff5a5f; font-weight: 800; font-size: 2.8rem; }
        .btn-action { background-color: #43d1a2; color: white; border: none; border-radius: 50px; padding: 16px 45px; font-weight: 700; width: 100%; margin-top: 25px; }
        .map-section { margin-top: 30px; border-radius: 20px; overflow: hidden; border: 1px solid #eee; height: 300px; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="back-link" onclick="window.parent.location.href='/'"><i class="bi bi-arrow-left me-2"></i>Kembali ke Beranda</div>
        <div class="card detail-card shadow-lg"><div class="row g-5">
            <div class="col-lg-5">
                <div class="img-container">
                    <img src="/static/images/{{ image_file }}" onerror="this.src='https://placehold.co/600x400?text=No+Image';">
                </div>
                <div class="map-section"><iframe width="100%" height="100%" src="https://maps.google.com/maps?q={{ lat }},{{ long }}&hl=id&z=15&output=embed"></iframe></div>
            </div>
            <div class="col-lg-7">
                <h1 class="hotel-title mb-1">{{ nama_hotel }}</h1>
                <p class="text-muted mb-4"><i class="bi bi-geo-alt-fill text-danger me-2"></i>Jakarta, Indonesia</p>
                <hr class="my-4" style="opacity: 0.1;">
                <h6 class="fw-bold mb-3 text-secondary text-uppercase" style="font-size: 0.75rem;">FASILITAS</h6>
                <div class="mb-3">{% for f in facilities %} <span class="fac-badge">{{ f }}</span> {% endfor %}</div>
                <div class="pt-2"><small class="text-muted">Mulai dari:</small><div class="price-val">Rp {{ harga }}</div></div>
                <button class="btn btn-action shadow">Lanjutkan Pembayaran</button>
            </div>
        </div></div>
    </div>
</body>
</html>
